name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        required: true
        type: string
        default: "dev"
      image_tag:
        description: "Docker image tag (e.g., latest, test-fix)"
        required: true
        type: string
        default: "latest"
      base_image_version:
        description: "Base image version"
        required: false
        type: string
        default: "1.5.3"

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"
          check-latest: true

      - name: Install build dependencies
        run: |
          pip install build tomli tomli-w

      - name: Get current version
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Build Python package
        run: |
          python3 -m build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/server:${{ inputs.image_tag }}
          push: true
          build-args: |
            MASS_VERSION=${{ steps.version.outputs.version }}
            BASE_IMAGE_VERSION=${{ inputs.base_image_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image built successfully
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo "Image: ghcr.io/${{ github.repository_owner }}/server:${{ inputs.image_tag }}"
          echo ""
          echo "Use this in your docker-compose.yml:"
          echo "image: ghcr.io/${{ github.repository_owner }}/server:${{ inputs.image_tag }}"
